<!DOCTYPE html>
  <html lang="pt-BR">
  <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogo do Quinze (N x N Configurável)</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Tone.js for Sound Effects -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
  <!-- Canvas Confetti for Victory Celebration -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <!-- <link rel="Styles/quinze.css">
  -->
  <!-- Forma correta de importar o ficheiro CSS da pasta Styles -->
  <link rel="stylesheet" href="Styles/quinze.css">

  <style>

  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');

body {
font-family:
  'Plus Jakarta Sans', sans-serif;
user-select:
  none;
-webkit-user-select:
  none;
touch-action:
  manipulation;
}

/* Puzzle Container Aspect Ratio Wrapper */
.puzzle-board-container {
            position: relative;
            width: 100%;
            padding-bottom: 100%; /* Keeps 1:1 aspect ratio */
        }

        .puzzle-board {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .puzzle-tile {
            position: absolute;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            cursor: pointer;
            will-change: transform;
            transition: transform 0.15s cubic-bezier(0.25, 1, 0.5, 1);
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        .puzzle-tile:hover {
            filter: brightness(1.1);
        }

        .puzzle-tile:active {
            transform: scale(0.95) !important;
        }

        /* Responsive tile font sizing utility dynamically scaled */
        .tile-text {
            line-height: 1;
            text-shadow: 0 1px 2px rgba(0,0,0,0.4);
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(156, 163, 175, 0.5);
            border-radius: 3px;
        }
  

  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between items-center p-3 sm:p-5">

    <!-- Header Section -->
    <header class="w-full max-w-lg flex justify-between items-center my-2">
        <div class="flex items-center gap-3">
            <div class="bg-indigo-600 text-white p-2.5 rounded-2xl shadow-lg shadow-indigo-500/30">
                <i class="fa-solid fa-shapes text-2xl"></i>
            </div>
            <div>
                <h1 class="text-xl sm:text-2xl font-extrabold tracking-tight bg-gradient-to-r from-indigo-400 to-violet-300 bg-clip-text text-transparent">
                    Jogo do Quinze N×N
                </h1>
                <p class="text-xs text-slate-400 font-medium">Ordene os números de 1 até N-1</p>
            </div>
        </div>

        <button id="soundToggleBtn" onclick="toggleSound()" class="p-3 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl transition border border-slate-700/50 shadow-md">
            <i id="soundIcon" class="fa-solid fa-volume-high"></i>
        </button>
    </header>

    <!-- Main Game Area -->
    <main class="w-full max-w-lg flex flex-col items-center gap-3 my-auto">
        
        <!-- Controls: Grid Size Selector & Actions -->
        <div class="w-full bg-slate-800/80 border border-slate-700/80 rounded-2xl p-3 shadow-lg flex flex-wrap items-center justify-between gap-3">
            <div class="flex items-center gap-2">
                <label for="gridSizeSelect" class="text-xs font-bold uppercase tracking-wider text-slate-400">Tamanho:</label>
                <select id="gridSizeSelect" onchange="changeGridSize(this.value)" class="bg-slate-900 border border-slate-700 text-indigo-300 font-extrabold text-sm rounded-xl px-3 py-1.5 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <!-- Dynamic options 3 to 20 -->
                </select>
            </div>

            <div class="flex gap-2">
                <button onclick="shuffleBoard()" class="py-1.5 px-3 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold rounded-xl shadow-md transition active:scale-95 flex items-center gap-1.5">
                    <i class="fa-solid fa-shuffle"></i> Embaralhar
                </button>
                <button onclick="resetBoard()" class="py-1.5 px-3 bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs font-semibold rounded-xl border border-slate-600 transition active:scale-95 flex items-center gap-1.5">
                    <i class="fa-solid fa-rotate-left"></i> Reiniciar
                </button>
            </div>
        </div>

        <!-- Scoreboard & Timer -->
        <div class="w-full grid grid-cols-2 gap-3">
            <div class="bg-slate-800/80 backdrop-blur-md rounded-2xl p-2.5 text-center border border-slate-700/60 shadow-lg">
                <span class="text-[10px] sm:text-xs font-semibold uppercase tracking-wider text-slate-400 flex items-center justify-center gap-1 mb-0.5">
                    <i class="fa-solid fa-shoe-prints text-indigo-400"></i> Movimentos
                </span>
                <span id="movesCount" class="text-xl sm:text-2xl font-black text-white">0</span>
            </div>
            <div class="bg-slate-800/80 backdrop-blur-md rounded-2xl p-2.5 text-center border border-slate-700/60 shadow-lg">
                <span class="text-[10px] sm:text-xs font-semibold uppercase tracking-wider text-slate-400 flex items-center justify-center gap-1 mb-0.5">
                    <i class="fa-regular fa-clock text-indigo-400"></i> Tempo
                </span>
                <span id="timerText" class="text-xl sm:text-2xl font-black text-white">00:00</span>
            </div>
        </div>

        <!-- Puzzle Board Wrapper -->
        <div class="w-full bg-slate-800 p-2.5 rounded-3xl border border-slate-700 shadow-2xl shadow-indigo-950/40 relative">
            <div class="puzzle-board-container">
                <div id="puzzleBoard" class="puzzle-board">
                    <!-- Tiles dynamically generated via JavaScript -->
                </div>
            </div>
        </div>

        <!-- Keyboard / Touch Instructions -->
        <div class="text-center text-xs text-slate-400">
            <p><i class="fa-solid fa-keyboard text-indigo-400 mr-1"></i> Use as <strong>Setas do Teclado (PC)</strong> ou <strong>Clique no quadrado ao lado do espaço vazio</strong>.</p>
        </div>
    </main>

    <!-- Footer -->
    <footer class="text-center text-xs text-slate-500 py-2">
        By Gemini + Lobato
    </footer>

    <!-- Victory Modal -->
    <div id="victoryModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4 z-50 opacity-0 pointer-events-none transition-all duration-300">
        <div class="bg-slate-800 border border-slate-700 rounded-3xl p-6 max-w-xs w-full text-center shadow-2xl transform scale-90 transition-all duration-300 id-modal-card">
            <div class="w-16 h-16 bg-gradient-to-tr from-amber-400 to-yellow-300 rounded-2xl flex items-center justify-center mx-auto mb-4 text-slate-900 shadow-lg shadow-amber-500/30">
                <i class="fa-solid fa-trophy text-3xl"></i>
            </div>
            
            <h2 class="text-2xl font-black text-white mb-1">Parabéns!</h2>
            <p class="text-sm text-slate-400 mb-6">Você concluiu o desafio <span id="modalGridDesc" class="font-bold text-indigo-400"></span>!</p>

            <div class="bg-slate-900/60 rounded-2xl p-4 mb-6 grid grid-cols-2 gap-2 border border-slate-700/50">
                <div>
                    <span class="block text-xs text-slate-400">Movimentos</span>
                    <span id="finalMoves" class="text-lg font-bold text-indigo-400">0</span>
                </div>
                <div>
                    <span class="block text-xs text-slate-400">Tempo</span>
                    <span id="finalTime" class="text-lg font-bold text-indigo-400">00:00</span>
                </div>
            </div>

            <button onclick="closeVictoryModal();" class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-xl shadow-lg shadow-indigo-600/30 active:scale-[0.98] transition">
                Ver Grid Montado
            </button>
        </div>
    </div>

    
    <script>
        // State Variables
        let gridSize = 4; // Default 4x4
        let totalTiles = 16;
        let tiles = []; // Array storing current positions (0 = empty slot)
        let moves = 0;
        let timer = null;
        let secondsElapsed = 0;
        let isGameActive = false;
        let isMuted = false;
        let tileColors = {};

        // Sound FX setup
        let slideSynth;

        function initAudio() {
            if (!slideSynth) {
                slideSynth = new Tone.MembraneSynth({
                    pitchDecay: 0.01,
                    octaves: 2,
                    oscillator: { type: "sine" },
                    envelope: { attack: 0.001, decay: 0.1, sustain: 0, release: 0.1 }
                }).toDestination();
                slideSynth.volume.value = -12;
            }
        }

        function playSlideSound() {
            if (isMuted) return;
            try {
                if (Tone.context.state !== 'running') {
                    Tone.start();
                }
                initAudio();
                slideSynth.triggerAttackRelease("C2", "8n");
            } catch (e) {}
        }

        function playWinSound() {
            if (isMuted) return;
            try {
                if (Tone.context.state !== 'running') {
                    Tone.start();
                }
                const now = Tone.now();
                const poly = new Tone.PolySynth(Tone.Synth).toDestination();
                poly.volume.value = -8;
                poly.triggerAttackRelease(["C4", "E4", "G4", "C5"], "0.3", now);
                poly.triggerAttackRelease(["G4", "B4", "D5", "G5"], "0.5", now + 0.25);
            } catch (e) {}
        }

        function toggleSound() {
            isMuted = !isMuted;
            const icon = document.getElementById('soundIcon');
            if (isMuted) {
                icon.className = 'fa-solid fa-volume-xmark text-slate-500';
            } else {
                icon.className = 'fa-solid fa-volume-high text-slate-300';
            }
        }

        // Initialize grid size selector options (3x3 to 20x20)
        function populateGridSizeOptions() {
            const select = document.getElementById('gridSizeSelect');
            select.innerHTML = '';
            for (let i = 3; i <= 20; i++) {
                const opt = document.createElement('option');
                opt.value = i;
                opt.innerText = `${i} x ${i}`;
                if (i === 4) opt.selected = true;
                select.appendChild(opt);
            }
        }

        function changeGridSize(newSize) {
            gridSize = parseInt(newSize, 10);
            formColors();
            totalTiles = gridSize * gridSize;
            createBoard();
            shuffleBoard();
        }

        // Initialize/Re-create DOM tiles
        function createBoard(tilesPreSaved = false) {
            const board = document.getElementById('puzzleBoard');
            board.innerHTML = '';

            // Initial solved order: [1, 2, ..., N^2-1, 0]
            if (!tilesPreSaved) tiles = Array.from({ length: totalTiles }, (_, i) => (i === totalTiles - 1 ? 0 : i + 1));

            // Dynamic font sizing calculation depending on grid dimension
            let fontSizeClass = "text-xl";
            if (gridSize >= 12) fontSizeClass = "text-[9px]";
            else if (gridSize >= 8) fontSizeClass = "text-xs";
            else if (gridSize >= 6) fontSizeClass = "text-sm";
            else if (gridSize >= 5) fontSizeClass = "text-base";

            for (let i = 1; i < totalTiles; i++) {
                const tile = document.createElement('div');
                tile.id = `tile-${i}`;
                tile.className = `puzzle-tile rounded-lg sm:rounded-xl bg-gradient-to-br from-indigo-500 to-indigo-700 text-white border border-indigo-400/30 ${fontSizeClass}`;
                
                const span = document.createElement('span');
                span.className = 'tile-text';
                span.innerText = i;
                tile.appendChild(span);

                // Smart click listener: Moves tile if adjacent to empty slot
                tile.addEventListener('mousedown', () => handleTileClick(i));
tile.addEventListener('touchstart', (e) => {
    e.preventDefault(); // Evita disparo duplo em telas de toque
    handleTileClick(i);
});

                board.appendChild(tile);
            }

            updateBoardUI(false);
        }

        

        // Colorama
        function formColors(){
            let t = 255,k=t*3/(gridSize-1),l=0;
            grid = [{}];
            for (let i=1;i<=gridSize*gridSize;i++){
                grid[l][i] = [197,53,15];
                if (i%gridSize==0){
                    grid[l+1] = {};
                    l++;
                }
            }

            for (let i=1;i<=gridSize;i++){
                for (let j=1;j<=gridSize;j++){
                    tileColors[i+(j-1)*gridSize] = grid[j-1][i+(j-1)*gridSize];
                }
            }

            let pot = 0;
            for (let niv=0;niv<gridSize-1;niv++){
                clr = [0,0,0];
                let rel = k*niv;
                if (pot>=t*2){
                    clr = [rel%255,0,255-rel%255];
                }else if (pot>=t){
                    clr = [0,255-rel%255,rel%255];
                }else{
                    clr = [255-rel%255,rel%255,0];
                }
                // console.log(clr);
                for (let i=1;i<=gridSize-niv;i++){
                    tileColors[i+niv*(gridSize+1)] = clr;
                    tileColors[1+(i-1)*gridSize+niv*(gridSize+1)] = clr;
                }
                pot += k;
            }

            
            // console.log(tileColors);

        }

        // Render current tiles state into positions
        function updateBoardUI(animate = true) {
            const tileSizePercent = 100 / gridSize;
            const gapPercent = 0.5; // Slight visual margin

            tiles.forEach((value, index) => {
                if (value !== 0) {
                    const tile = document.getElementById(`tile-${value}`);
                    if (!tile) return;

                    const row = Math.floor(index / gridSize);
                    const col = index % gridSize;

                    // Compute dynamic sizing and positioning
                    tile.style.width = `calc(${tileSizePercent}% - 2px)`;
                    tile.style.height = `calc(${tileSizePercent}% - 2px)`;
                    // if (index==0) tile.style.background = `rgb(155,24,89)`;
                    // else tile.style.background = ``;
                    if (value!=0){
                        // console.log(value);
                        let clr = tileColors[value];
                        tile.style.background = `rgb(`+clr[0]+`,`+clr[1]+`,`+clr[2]+`)`;
                    }

                    const posX = col * 100;
                    const posY = row * 100;

                    if (!animate) {
                        tile.style.transition = 'none';
                    } else {
                        tile.style.transition = 'transform 0.15s cubic-bezier(0.25, 1, 0.5, 1)';
                    }

                    tile.style.transform = `translate3d(${posX}%, ${posY}%, 0)`;
                }
            });
        }

        // Click handler: If tile is adjacent to empty space, slide it
        function handleTileClick(tileValue) {
            const tileIndex = tiles.indexOf(tileValue);
            const emptyIndex = tiles.indexOf(0);

            if (canMove(tileIndex, emptyIndex)) {
                makeMove(tileIndex, emptyIndex);
            }
        }

        // Test adjacency (row or column offset by 1)
        function canMove(idx1, idx2) {
            const row1 = Math.floor(idx1 / gridSize);
            const col1 = idx1 % gridSize;
            const row2 = Math.floor(idx2 / gridSize);
            const col2 = idx2 % gridSize;

            const isAdjacentRow = Math.abs(row1 - row2) === 1 && col1 === col2;
            const isAdjacentCol = Math.abs(col1 - col2) === 1 && row1 === row2;

            return isAdjacentRow || isAdjacentCol;
        }

        // Perform move logic
        function makeMove(fromIndex, toIndex) {
            if (!isGameActive) {
                startTimer();
                isGameActive = true;
            }

            // Swap values
            [tiles[fromIndex], tiles[toIndex]] = [tiles[toIndex], tiles[fromIndex]];

            moves++;
            document.getElementById('movesCount').innerText = moves;

            playSlideSound();
            updateBoardUI(true);
            state = {
  gridSize:
  gridSize,
  totalTiles:
  totalTiles,
  tiles:
  tiles,
  moves:
  moves,
  secondsElapsed:
  secondsElapsed,
  isGameActive:
  isGameActive,
  isMuted:
  isMuted,
};
saveProgress(state);

            if (checkVictory()) {
                handleVictory();
            }
        }

        // Generic Solvability Check for ANY N x N board size:
        // 1. Calculate inversion count.
        // 2. If N is odd: Solvability requires Inversions to be EVEN.
        // 3. If N is even: Solvability requires:
        //    (Inversions + Row of empty slot from bottom [1-based]) to be EVEN.
        function isSolvable(arr) {
            let inversions = 0;
            const flatTiles = arr.filter(val => val !== 0);

            for (let i = 0; i < flatTiles.length; i++) {
                for (let j = i + 1; j < flatTiles.length; j++) {
                    if (flatTiles[i] > flatTiles[j]) {
                        inversions++;
                    }
                }
            }
            console.log("Inversions: "+inversions);
            if (gridSize % 2 !== 0) {
                // Odd grid size (3x3, 5x5, 7x7...)
                return inversions % 2 === 0;
            } else {
                // Even grid size (4x4, 6x6, 8x8...)
                const emptyIndex = arr.indexOf(0);
                const emptyRowFromTop = Math.floor(emptyIndex / gridSize);
                const emptyRowFromBottom = gridSize - emptyRowFromTop; // 1-based from bottom
                console.log("Line 0: "+emptyRowFromBottom);
                return (inversions + emptyRowFromBottom) % 2 !== 0;
            }
        }

        function isSolvedAlready(arr) {
            for (let i = 0; i < totalTiles - 1; i++) {
                if (arr[i] !== i + 1) return false;
            }
            return arr[totalTiles - 1] === 0;
        }

        // Shuffle board guaranteeing solvability
        function shuffleBoard() {
            stopTimer();
            resetTimer();
            moves = 0;
            document.getElementById('movesCount').innerText = '0';
            isGameActive = false;

            do {
                // Fisher-Yates Shuffle
                for (let i = tiles.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [tiles[i], tiles[j]] = [tiles[j], tiles[i]];
                }
            } while (!isSolvable(tiles) || isSolvedAlready(tiles));

            updateBoardUI(true);
        }

        function resetBoard() {
            stopTimer();
            resetTimer();
            moves = 0;
            document.getElementById('movesCount').innerText = '0';
            isGameActive = false;

            tiles = Array.from({ length: totalTiles }, (_, i) => (i === totalTiles - 1 ? 0 : i + 1));
            updateBoardUI(true);
        }

        // Victory check
        function checkVictory() {
            return isSolvedAlready(tiles);
        }

        function handleVictory() {
            stopTimer();
            isGameActive = false;
            playWinSound();

            try {
                confetti({
                    particleCount: 120,
                    spread: 80,
                    origin: { y: 0.6 }
                });
            } catch (e) {}

            document.getElementById('modalGridDesc').innerText = `${gridSize}×${gridSize}`;
            document.getElementById('finalMoves').innerText = moves;
            document.getElementById('finalTime').innerText = formatTime(secondsElapsed);

            const modal = document.getElementById('victoryModal');
            modal.classList.remove('opacity-0', 'pointer-events-none');
            modal.querySelector('.id-modal-card').classList.remove('scale-90');
            modal.querySelector('.id-modal-card').classList.add('scale-100');
        }

        function closeVictoryModal() {
            const modal = document.getElementById('victoryModal');
            modal.classList.add('opacity-0', 'pointer-events-none');
            modal.querySelector('.id-modal-card').classList.remove('scale-100');
            modal.querySelector('.id-modal-card').classList.add('scale-90');
        }

        // Timer
        function startTimer() {
            if (timer) clearInterval(timer);
            timer = setInterval(() => {
                secondsElapsed++;
                document.getElementById('timerText').innerText = formatTime(secondsElapsed);
            }, 1000);
        }

        function stopTimer() {
            if (timer) clearInterval(timer);
            timer = null;
        }

        function resetTimer() {
            secondsElapsed = 0;
            document.getElementById('timerText').innerText = '00:00';
        }

        function formatTime(totalSeconds) {
            const mins = Math.floor(totalSeconds / 60);
            const secs = totalSeconds % 60;
            return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        }

        // Objeto com o estado atual do seu jogo
function saveProgress(state) {
  // Converte o objeto do jogo em uma string JSON e salva
  localStorage.setItem('saved', JSON.stringify(state));
  console.log('Jogo salvo com sucesso!');
}
function loadProgress() {
  const dadosSalvos = localStorage.getItem('saved');

  if (dadosSalvos !== null) {
    // Converte a string JSON de volta para um objeto JavaScript
    const estadoCarregado = JSON.parse(dadosSalvos);
    console.log('Dados carregados:', estadoCarregado);
    return estadoCarregado;
  } else {
    console.log('Nenhum jogo salvo foi encontrado.');
    return null;
  }
}

        // PC Keyboard Controls (Arrow Keys)
        document.addEventListener('keydown', (e) => {
            if (!['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) {
                return;
            }
            e.preventDefault();

            const emptyIndex = tiles.indexOf(0);
            const emptyRow = Math.floor(emptyIndex / gridSize);
            const emptyCol = emptyIndex % gridSize;

            let targetIndex = -1;

            // Pressing Arrow Up slides the tile BELOW the empty space UP into the empty slot.
            if (e.key === 'ArrowUp' && emptyRow < gridSize - 1) {
                targetIndex = emptyIndex + gridSize;
            }
            // Pressing Arrow Down slides the tile ABOVE the empty space DOWN into the empty slot.
            else if (e.key === 'ArrowDown' && emptyRow > 0) {
                targetIndex = emptyIndex - gridSize;
            }
            // Pressing Arrow Left slides the tile to the RIGHT of empty space LEFT into empty slot.
            else if (e.key === 'ArrowLeft' && emptyCol < gridSize - 1) {
                targetIndex = emptyIndex + 1;
            }
            // Pressing Arrow Right slides the tile to the LEFT of empty space RIGHT into empty slot.
            else if (e.key === 'ArrowRight' && emptyCol > 0) {
                targetIndex = emptyIndex - 1;
            }

            if (targetIndex !== -1 && targetIndex >= 0 && targetIndex < totalTiles) {
                makeMove(targetIndex, emptyIndex);
            }
        });

        // Window resize event handler
        window.addEventListener('resize', () => updateBoardUI(false));

        // On Load
        window.onload = () => {
        populateGridSizeOptions();
        state = loadProgress();
        if (state==null) {
            formColors();
            createBoard();
            shuffleBoard();
        } else {
            //         state = {
            //         gridSize: gridSize,
            // totalTiles: totalTiles,
            // tiles: tiles,
            // moves: moves,
            // secondsElapsed: secondsElapsed,
            // isGameActive: isGameActive,
            // isMuted: isMuted,
            //     };
            gridSize = state.gridSize;
            totalTiles = state.totalTiles;
            secondsElapsed = state.secondsElapsed;
            tiles = state.tiles;
            moves = state.moves;
            isGameActive = state.isGameActive;
            isMuted = state.isMuted;
            formColors();
            createBoard(true);
        }
        
        };
        // populateGridSizeOptions();
        //     formColors();
        //     createBoard();
        //     shuffleBoard();
    </script>
</body>
</html>
